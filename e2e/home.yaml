# Smoke: Home shows its three sections. Run with `maestro test e2e/home.yaml` (one booted simulator/emulator).
# Demo mode is switched on explicitly through Settings, so the flow also works on a live build.
appId: com.openagentspocket.app
---
- launchApp:
    clearState: true
- openLink: openagentspocket:///settings
# The switch is below the fold of the Settings root: scroll to it, then open Home by link
# (Settings is a root screen here, so `back` has nowhere to go).
- scrollUntilVisible:
    element:
      id: settings.general.demoMode
- tapOn:
    id: settings.general.demoMode
- openLink: openagentspocket:///
- assertVisible: "OpenAgentsPocket"
- assertVisible: "NEEDS YOU.*"
- assertVisible: "WORKING.*"
- assertVisible: "DONE.*"
