# Agent lab: add the lab as a Host (127.0.0.1, the lab's sshd port, Device Key), trust its own host
# key, and see the lab's Agent on Home. HOST, PORT and USER come from the lab (no defaults here).
appId: com.openagentspocket.app
---
- launchApp
- openLink: openagentspocket:///hosts
- tapOn:
    id: hosts-add
- tapOn:
    id: host-user
- inputText: ${USER}
- tapOn:
    id: route-0
- tapOn:
    id: route-0-address
- inputText: ${HOST}
- tapOn:
    id: route-0-port
- eraseText: 6
- inputText: ${PORT}
- tapOn:
    id: route-back
- tapOn:
    id: host-save
# The Host's sheet opens after Save and the checks ask "Trust this Host?" over it.
- extendedWaitUntil:
    visible:
      id: alert-alert
    timeout: 30000
- assertVisible: "Trust this Host?"
# Trust only the lab's own host key: the fingerprint the lab printed.
- assertVisible: ".*${FINGERPRINT}.*"
- takeScreenshot: design/atlas/sim/${SHOTS}02-trust
- tapOn:
    id: alert-action-confirm
- extendedWaitUntil:
    visible: "Connected.*"
    timeout: 30000
- takeScreenshot: design/atlas/sim/${SHOTS}02-host
- openLink: openagentspocket:///
- extendedWaitUntil:
    visible:
      id: "session-.*${PANE}"
    timeout: 30000
- assertNotVisible: "Demo Host"
- runFlow: ../sim/_guard.yaml
- takeScreenshot: design/atlas/sim/${SHOTS}02-home
