# Agent lab: Chat shows the real conversation (the lab sent "pong" in the terminal first, because
# OpenCode's home screen takes no message from Chat), then a message from the Composer is answered.
appId: com.openagentspocket.app
---
- runFlow: _open-agent.yaml
- extendedWaitUntil:
    visible: "Reply with the single word pong."
    timeout: 30000
- takeScreenshot: design/atlas/sim/live-03-chat
- tapOn:
    id: composer-input
- inputText: "Reply with the single word ping."
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: "(?i)ping\\.?"
    timeout: 120000
- runFlow: ../sim/_guard.yaml
- takeScreenshot: design/atlas/sim/live-03-sent
