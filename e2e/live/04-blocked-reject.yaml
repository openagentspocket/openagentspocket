# Agent lab: a real OpenCode shell permission as a Blocked card. Never approves: the card's kind and
# its option order are asserted first, and the only option tapped is matched by id AND exact label.
appId: com.openagentspocket.app
---
- runFlow: _open-agent.yaml
- tapOn:
    id: composer-input
- inputText: "Run the shell command ls in this directory and tell me what you see."
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible:
      id: blocked-card
    timeout: 180000
- assertVisible: "Permission required.*"
- assertVisible:
    id: blocked-option-1
    text: "Allow once"
- assertVisible:
    id: blocked-option-3
    text: "Reject"
- takeScreenshot: design/atlas/sim/live-04-blocked
- tapOn:
    id: blocked-option-3
    text: "Reject"
# The card matches OpenCode's own permission to the conversation's waiting call, so Reject sends
# Esc (OpenCode rejects it) and the card goes away, with no refusal notice.
- extendedWaitUntil:
    notVisible:
      id: blocked-card
    timeout: 20000
- assertNotVisible:
    id: blocked-notice
- runFlow: ../sim/_guard.yaml
- takeScreenshot: design/atlas/sim/live-04-rejected
