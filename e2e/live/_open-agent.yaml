# Opens the lab's OpenCode Agent (pane w1:p1) from its Sessions card on Home (an idle Agent is not
# in the inbox; the card id is `session-<host id><separator>w1:p1`), on its Chat.
appId: com.openagentspocket.app
---
- launchApp
- openLink: openagentspocket:///
- extendedWaitUntil:
    visible:
      id: "session-.*w1:p1"
    timeout: 30000
- tapOn:
    id: "session-.*w1:p1"
- extendedWaitUntil:
    visible:
      id: agent-header
    timeout: 20000
- runFlow: ../sim/_guard.yaml
