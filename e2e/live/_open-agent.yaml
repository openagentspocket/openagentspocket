# Opens the lab's Agent (pane PANE, w1:p1) from its Sessions card on Home (an idle Agent is not
# in the inbox; the card id is `session-<host id><separator><pane>`), on its Chat.
appId: com.openagentspocket.app
---
- launchApp
- openLink: openagentspocket:///
- extendedWaitUntil:
    visible:
      id: "session-.*${PANE}"
    timeout: 30000
- tapOn:
    id: "session-.*${PANE}"
- extendedWaitUntil:
    visible:
      id: agent-header
    timeout: 20000
- runFlow: ../sim/_guard.yaml
