# Agent lab: Usage reads the lab's plugin. OpenCode has no Usage card (its collector reports
# nothing); Codex has one, from its rollouts and its service limits.
appId: com.openagentspocket.app
---
- launchApp
- openLink: openagentspocket:///
- tapOn:
    id: home-usage-ring
- waitForAnimationToEnd
- tapOn:
    id: open-full-usage
- extendedWaitUntil:
    visible:
      id: usage-screen
    timeout: 15000
- runFlow:
    when:
      true: ${USAGE_HAS_CARD == 'false'}
    commands:
      - assertNotVisible: ${USAGE_CARD}
- runFlow:
    when:
      true: ${USAGE_HAS_CARD == 'true'}
    commands:
      - extendedWaitUntil:
          visible: ${USAGE_CARD}
          timeout: 30000
- runFlow: ../sim/_guard.yaml
- takeScreenshot: design/atlas/sim/${SHOTS}07-usage
