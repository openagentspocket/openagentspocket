# Agent lab: OpenCode's shortcuts menu, and Switch Agent (Shift+Tab) moving its mode from Build to
# Plan and back, as the header's mode chip reads it from the real screen.
appId: com.openagentspocket.app
---
- runFlow: _open-agent.yaml
- extendedWaitUntil:
    visible: "Build"
    timeout: 20000
# The shortcuts circle shows while the Composer is focused.
- tapOn:
    id: composer-input
- tapOn:
    id: composer-shortcuts
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Switch Agent"
    timeout: 4000
- assertVisible: "Interrupt"
# /new: a native menu item exposes its title to Maestro, not its subtitle.
- assertVisible: "New Conversation"
- takeScreenshot: design/atlas/sim/live-06-shortcuts
- tapOn: "Switch Agent"
- extendedWaitUntil:
    visible: "Plan"
    timeout: 15000
- takeScreenshot: design/atlas/sim/live-06-plan
# The shortcuts circle shows while the Composer is focused.
- tapOn:
    id: composer-input
- tapOn:
    id: composer-shortcuts
    retryTapIfNoChange: false
- tapOn: "Switch Agent"
- extendedWaitUntil:
    visible: "Build"
    timeout: 15000
- runFlow: ../sim/_guard.yaml
