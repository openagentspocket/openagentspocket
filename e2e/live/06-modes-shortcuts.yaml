# Agent lab: the program's shortcuts menu, and its mode shortcut (Shift+Tab) moving the mode from
# MODE_A to MODE_B and back, as the header's mode chip reads it from the real screen.
appId: com.openagentspocket.app
---
- runFlow: _open-agent.yaml
- extendedWaitUntil:
    visible: ${MODE_A}
    timeout: 20000
# The shortcuts circle shows while the Composer is focused.
- tapOn:
    id: composer-input
- tapOn:
    id: composer-shortcuts
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: ${MODE_SHORTCUT}
    timeout: 4000
- assertVisible: "Interrupt"
# /new: a native menu item exposes its title to Maestro, not its subtitle.
- assertVisible: "New Conversation"
- takeScreenshot: design/atlas/sim/${SHOTS}06-shortcuts
- tapOn: ${MODE_SHORTCUT}
- extendedWaitUntil:
    visible: ${MODE_B}
    timeout: 15000
- takeScreenshot: design/atlas/sim/${SHOTS}06-plan
- runFlow:
    file: _switch-mode.yaml
    env:
      MODE: ${MODE_A}
- runFlow: ../sim/_guard.yaml
