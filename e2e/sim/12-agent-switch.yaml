# Smoke: moving between Agents from the title's menu on the terminal, and from Sessions on Chat.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p2
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-sidebar
- tapOn:
    id: "session-drawer-row-.*p1"
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 5000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- extendedWaitUntil:
    visible:
      id: agent-header-title
    timeout: 5000
- tapOn:
    id: agent-header-title
- takeScreenshot: design/atlas/sim/12-agent-menu
- tapOn:
    id: "agent-header-agents-p3"
- extendedWaitUntil:
    visible:
      id: agent-header-title
    timeout: 5000
- tapOn:
    id: agent-header-title
- tapOn:
    id: "agent-header-agents-p2"
- extendedWaitUntil:
    visible:
      id: agent-header-title
    timeout: 5000
- runFlow: _guard.yaml
- takeScreenshot: design/atlas/sim/12-agent-switch
