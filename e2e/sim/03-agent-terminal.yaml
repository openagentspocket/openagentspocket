# Smoke: the same Agent on its terminal surface.
appId: com.openagentspocket.app
---
- runFlow: _demo.yaml
- tapOn:
    id: inbox-p2
- extendedWaitUntil:
    visible:
      id: agent-header-sidebar
    timeout: 15000
- tapOn:
    id: agent-header-more
- tapOn: "Show Terminal"
- waitForAnimationToEnd
- runFlow: _guard.yaml
- takeScreenshot: design/atlas/sim/03-agent-terminal
- tapOn:
    id: composer-input
- extendedWaitUntil:
    visible:
      id: composer-more
    timeout: 4000
- inputText: "ls"
- waitForAnimationToEnd
- takeScreenshot: design/atlas/sim/03-agent-terminal-keyboard
- tapOn:
    id: composer-more
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Close Agent"
    timeout: 4000
- runFlow: _guard.yaml
