# Live: add the isolated herdr backend Host, trust its key, see its agent on Home.
# Run with `maestro test -e HOST=<address> -e PORT=<ssh port> -e USER=<account> e2e/live.yaml`
# on a build WITHOUT EXPO_PUBLIC_DEMO. Prerequisites (integrator):
#   - the isolated backend is up (sshd + a herdr socket with one running agent), reachable from the device;
#   - the device key is authorized for USER on it (first run: copy the key shown by the Host form's
#     "Copy authorized_keys Line" or authorize it from the pairing ceremony).
# The isolated backend (scripts/isolated-herdr-backend.py in the Swift repo) listens on its own port, so
# pass PORT; the flow has no defaults on purpose, a default in this file would override the -e values.
# `start` prints the Host settings; `authorize` appends the device key (see docs/e2e-live-backend.md).
# For an Agent to appear it needs one report, for example:
#   python3 scripts/isolated-herdr-backend.py run -- pane report-agent --source verify --agent claude --state working w1:p1
# English UI. Never point this at a personal Host.
appId: com.openagentspocket.app
---
- launchApp:
    clearState: true
- openLink: openagentspocket:///hosts
- assertVisible: "No Hosts"
- tapOn:
    id: hosts-add
- tapOn:
    id: host-user
- inputText: ${USER}
- tapOn:
    id: route-0-address
- inputText: ${HOST}
- tapOn:
    id: route-0-port
- eraseText: 5
- inputText: ${PORT}
# hideKeyboard fails on iOS 26.5: tap a static label, then scroll to the button.
- tapOn: "Routes"
- scrollUntilVisible:
    element:
      id: host-save
- tapOn:
    id: host-save
# The first connection asks to trust the key the backend presents.
- assertVisible: "Trust this Host?"
- tapOn: "Trust"
- assertVisible: "Connected"
- assertVisible: "In Use"
- back
- assertVisible: "Connected"
# Home shows the backend's agents from the live Console, not the demo data.
- openLink: openagentspocket:///
- assertNotVisible: "Demo Host"
- extendedWaitUntil:
    visible:
      text: "WORKING.*|NEEDS YOU.*|DONE.*"
    timeout: 20000
- takeScreenshot: live-home
# Home -> Agents -> agent detail, through the footer's See all.
- tapOn:
    id: home-see-all
- extendedWaitUntil:
    visible:
      id: "agent-row-.*"
    timeout: 20000
- takeScreenshot: live-agents
- tapOn:
    id: "agent-row-.*"
- extendedWaitUntil:
    visible:
      id: agent-header
    timeout: 20000
- assertVisible:
    id: agent-detail
- takeScreenshot: live-agent-detail
# The Agent's header menu reaches Changes.
- tapOn:
    id: agent-more-menu
- assertVisible: "Changes"
- assertVisible: "Ports"
- tapOn: "Changes"
- extendedWaitUntil:
    visible:
      id: changes-screen
    timeout: 20000
- takeScreenshot: live-changes
