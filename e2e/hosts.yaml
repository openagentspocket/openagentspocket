# Hosts: add a Host by hand, trust its key, see it in the list.
# Run with `maestro test e2e/hosts.yaml` (one booted simulator/emulator, English UI).
# Needs the demo build (`EXPO_PUBLIC_DEMO=1`): the offline demo probe scripts the trust prompt, no SSH.
# Build command: docs/e2e-live-backend.md ("Demo build for e2e/hosts.yaml").
# Against a real backend use e2e/live.yaml.
appId: com.openagentspocket.app
---
- launchApp:
    clearState: true
- openLink: openagentspocket:///hosts
- assertVisible: "No Hosts"
- tapOn:
    id: hosts-add
- tapOn:
    id: host-user
- inputText: demo
- tapOn:
    id: route-0-address
- inputText: workshop.example
- tapOn:
    id: route-0-port
- eraseText: 5
- inputText: "22"
# hideKeyboard fails on iOS 26.5: tap a static label, then scroll to the button.
- tapOn: "Routes"
- scrollUntilVisible:
    element:
      id: host-save
- tapOn:
    id: host-save
# The detail page opens and asks to trust the key on the first connection.
- assertVisible: "Trust this Host?"
- tapOn: "Trust"
- assertVisible: "Connected"
- assertVisible: "In Use"
- back
- assertVisible: "demo@workshop.example"
