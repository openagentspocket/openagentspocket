# The backlog of the port, one entry per task. The lead plans waves from it;
# workers never edit it (they write docs/progress/<id>.md). Status: todo |
# active | done | blocked. kind: js (no native build) | native (holds the
# native slot) | server (plugin/relay, node tests) | swift (in the Swift
# reference repo). Spec: docs/spec/parity.md (sections cited as §).
#
# Swift reference repo: ../Agentico (read-only for workers).

# ── Phase 1: Hosts + pairing + SSH transport ────────────────────────────────
- id: P1.1a-ssh-ios
  phase: 1
  kind: native
  title: SSH Expo Module, iOS, wrapping the Swift repo's AgenticoSSH (libssh2)
  deps: []
  files: [modules/ssh/ios/**, modules/ssh/expo-module.config.json, modules/ssh/src/**]
  swift_ref: [Packages/AgenticoSSH, Sources/Agentico/Transport/AgenticoSSHTransport*.swift]
  acceptance:
    - the six primitives of §1.1 behind the TS interface in modules/ssh/src (connect + host key, ed25519 auth with a key generated and kept natively, exec, streamlocal request/response and duplex, PTY with resize, SFTP stat/list/readRange/write/rename/unlink/mkdir, direct-tcpip)
    - an integration screen or test harness that, on the iOS simulator against `python3 ../Agentico/scripts/isolated-herdr-backend.py start --plugin`, runs ping (protocol >= 17), session.snapshot, a 1 MiB response, and a PTY echo; output saved as evidence
- id: P1.1b-ssh-android
  phase: 1
  kind: native
  title: SSH Expo Module, Android, with JSch (mwiede) + BouncyCastle
  deps: [P1.1a-ssh-ios]
  files: [modules/ssh/android/**]
  swift_ref: [Packages/AgenticoSSH]
  acceptance:
    - same primitives and the same integration run on the Android emulator (host reachable at 10.0.2.2)
- id: P1.2-core-wire
  phase: 1
  kind: js
  title: herdr wire envelope, methods, events, error model in packages/core
  deps: []
  files: [packages/core/src/wire/**, packages/core/src/errors/**]
  swift_ref:
    [
      Sources/Agentico/Transport/HerdrWire.swift,
      HerdrEvents.swift,
      JSONValue.swift,
      TransportError.swift,
      TransportError+*.swift,
    ]
  acceptance:
    - "U: request/response envelope with id matching; errors with empty ids tolerated; unknown enum values survive a round trip; every RESULT tag decodes from captured JSON; isRetryable table ported"
- id: P1.3-core-hosts
  phase: 1
  kind: js
  title: Host model, drafts, host-key TOFU rules, route race, preflight mapping
  deps: []
  files: [packages/core/src/hosts/**]
  swift_ref:
    [
      Sources/Agentico/Hosts/Host.swift,
      HostDraft.swift,
      HostStore.swift,
      Transport/RouteRace.swift,
      HostKeyFingerprint,
      KnownHostsStore,
      Hosts/Preflight.swift,
    ]
  acceptance:
    - "U: draft validation, fingerprint format, mayNameAnotherMachine table, route race (400 ms stagger, late winners discarded) with a fake clock, preflight failure mapping, plugin notice matrix vs plugin-version-v1.json"
- id: P1.4-core-pairing
  phase: 1
  kind: js
  title: Pairing code decode and the pairing ceremony state machine
  deps: []
  files: [packages/core/src/pairing/**]
  swift_ref:
    [
      Sources/Agentico/Pairing/PairingCode.swift,
      PairingCeremony.swift,
      SSHPairingConnector.swift,
      PairingScanStore.swift,
    ]
  acceptance:
    - "U: pairing-code-v1/v2 vectors (accept and reject cases); ceremony with a scripted connector: failure copy per step, nothing persisted on failure, retry drops the bootstrap after verificationFailed, Tailscale SSH banner rejected"
- id: P1.6-core-events
  phase: 1
  kind: js
  title: EventsSession (subscribe, resume/suspend, backoff, keepalive, overflow)
  deps: []
  files: [packages/core/src/events/**]
  swift_ref: [Sources/Agentico/Transport/EventsSession.swift, AgenticoSSHTransport+Events.swift]
  acceptance:
    - "U with a fake clock: backoff 1,2,4..30 s, non-retryable stops, keepalive ping after 30 s idle, pane subscriptions dropped on reconnect, overflow sheds oldest and emits eventsDropped, protocol floor 17"
- id: P1.5-app-hosts
  phase: 1
  kind: js
  title: Hosts screens (list, form, detail, trust alert, pairing scanner) on FakeTransport
  deps: [P1.3-core-hosts, P1.4-core-pairing, P0-ui-primitives, P0-qr-scanner]
  files: [apps/mobile/app/hosts/**, apps/mobile/src/features/hosts/**]
  acceptance:
    - "M: add a Host manually, trust alert, saved; paste a HERDR-PAIR code, ceremony steps shown; S: elements and copy of hosts.list, hosts.form, hosts.detail from the spec"
- id: P1.7-ssh-transport
  phase: 1
  kind: js
  title: herdr over SSH - the live transport (connect, host-key check, requests, events) in a new packages/transport
  deps: [P1.1a-ssh-ios, P1.1b-ssh-android, P1.2-core-wire, P1.3-core-hosts, P1.6-core-events]
  files: [packages/transport/**, tsconfig.json, docs/decisions/0024-*.md]
  swift_ref:
    [
      Sources/Agentico/Transport/AgenticoSSHTransport.swift,
      AgenticoSSHTransport+Requests.swift,
      AgenticoSSHTransport+HerdrAPI.swift,
      AgenticoSSHTransport+Events.swift,
      AgenticoSSHTransport+ErrorMapping.swift,
      BootstrappedExecChannel.swift,
      SSHChannelAdmission.swift,
      AgenticoSSHHostKeyVerifier.swift,
      HostKeyPolicy.swift,
      SSHCredentials.swift,
      SSHTransportSettings.swift,
      AsyncDeadline.swift,
      SharedAsyncOperation.swift,
    ]
  acceptance:
    - "U against modules/ssh FakeSsh: connect through the route race, TOFU and changed-key outcomes via the core host-key rules, a request round trip per herdr method family, events stream feeding EventsSession (reconnect, drop), channel admission limits, error mapping to TransportError; implements the core EventsTransport and ConsoleTransport interfaces (no redefinition)"
    - "ADR 0024: why a separate package (core stays free of native imports; it depends on core + agentico-ssh)"
- id: P1.8-host-services
  phase: 1
  kind: js
  title: Host services over the transport (environment, scripts, commands, plugin install/config, recent directories, staging, remote files)
  deps: [P1.7-ssh-transport]
  files: [packages/transport/src/host/**]
  swift_ref:
    [
      Sources/Agentico/Transport/AgenticoSSHTransport+HostCommands.swift,
      +HostEnvironment.swift,
      +HostFiles.swift,
      +HostScripts.swift,
      +Plugin.swift,
      AgenticoPluginInstallation.swift,
      +PluginConfigFiles.swift,
      +RecentDirectories.swift,
      +Staging.swift,
      RemoteFiles.swift,
      RemoteHostEnvironment.swift,
      RemoteHostPath.swift,
      NodeToolchainProbe.swift,
      AgentModelProbe.swift,
    ]
  acceptance:
    - "U against FakeSsh: each service's script/command and its parse, plugin version gate and install/upgrade flow, recent directories, staging paths"
- id: P1.9-secure-stores
  phase: 1
  kind: js
  title: Persistent stores - device key, secrets, known hosts, Host catalog (expo-secure-store + sqlite)
  deps: [P1.3-core-hosts]
  files: [apps/mobile/src/stores/**, packages/core/src/hosts/store*.ts]
  swift_ref:
    [
      Sources/Agentico/Transport/DeviceKey.swift,
      DeviceKeyStore.swift,
      SecretStore.swift,
      KnownHostsStore.swift,
      RSAKeyStore.swift,
      Sources/Agentico/Hosts/**,
    ]
  acceptance:
    - "U with in-memory adapters: catalog CRUD and migration, known-hosts trust/replace/forget, device key created once per alias through modules/ssh generateKey; adapters for expo-secure-store and expo-sqlite behind the core interfaces (the integrator rebuilds native)"

