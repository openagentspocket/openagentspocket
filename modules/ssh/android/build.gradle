plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.agentico'
version = '0.0.0'

android {
  namespace "expo.modules.agenticossh"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // SSH transport: JSch, the maintained fork (BSD-3-Clause). Android has no JDK 15 EdDSA or
  // JDK 11 XDH, so JSch takes its BouncyCastle implementations of Ed25519, curve25519,
  // chacha20-poly1305 and ML-KEM; the device key signs with BouncyCastle's Ed25519 too.
  implementation 'com.github.mwiede:jsch:2.28.8'
  implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}
