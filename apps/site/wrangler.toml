# openagentspocket.com: a static-assets-only Worker (no script). `pnpm deploy` builds dist/ from
# src/ and the shared tokens, then uploads it. The relay is a separate Worker (packages/relay).
name = "openagentspocket-site"
compatibility_date = "2026-07-01"
workers_dev = false

[assets]
directory = "./dist"
not_found_handling = "404-page"

[[routes]]
pattern = "openagentspocket.com"
custom_domain = true

[[routes]]
pattern = "www.openagentspocket.com"
custom_domain = true
