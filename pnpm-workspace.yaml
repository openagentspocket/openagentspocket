packages:
  - apps/*
  - packages/*
  - modules/*

# One React and one react-native for the whole repo (see docs/decisions/0009).
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1

# Build scripts allowed to run (pnpm 11 fails installs on unreviewed ones).
allowBuilds:
  "@parcel/watcher": true
  expo-libghostty: true

# Local fixes to dependencies, each meant to go upstream. expo-libghostty: the iOS
# terminal controller deletes its generated ghostty-config-*.conf right after loading
# it, and sweeps leftovers once per process (they piled up in the app's tmp folder).
patchedDependencies:
  expo-libghostty@0.8.1: patches/expo-libghostty@0.8.1.patch
